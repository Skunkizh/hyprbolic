# ~/.config/hypr/hyprlock.conf -- Hyprbolic
# Layout 12 from mahaveergurjar/Hyprlock-Dots, adapted for:
#   - a single monitor (2560x1440)
#   - wallpaper from ~/Pictures/Wallpaper/hyprlock.jpg
#   - no profile picture, no music widget
#   - dark boxes + white text so everything stays readable on a busy wallpaper

# ---------- Variables ----------
# Blank = applies to every monitor (there's only one here, but it also means this
# keeps working unmodified if someone runs it on a multi-monitor box).
$lockmon =
$wall    = ~/.config/hypr/wallpaper.png
$font    = JetBrainsMono Nerd Font

# Colours
$c_main = rgb(255, 255, 255)
$c_sub  = rgb(215, 222, 245)
$c_dim  = rgb(200, 208, 232)
$c_box  = rgba(8, 12, 26, 0.62)
$c_edge = rgba(255, 255, 255, 0.20)

# Horizontal position of the left-hand column, in pixels from the centre of the screen.
$colx = -630

# ---------- General ----------
general {
    no_fade_in = false
    disable_loading_bar = false
    grace = 0
}

# ---------- Backgrounds ----------
# Black fallback on every monitor, drawn underneath everything else.
background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
    zindex = -5
}

# Wallpaper only on the main monitor.
background {
    monitor = $lockmon
    path = $wall
    zindex = -3
    #blur_passes = 1
    #brightness = 0.8
}

# Optional: one dark panel behind the whole column, if you still find the
# wallpaper too busy. Remove the leading # on every line of this block to use it.
# Raise the 0.40 for a darker panel.
#shape {
#    monitor = $lockmon
#    size = 460, 720
#    color = rgba(6, 10, 24, 0.40)
#    rounding = 30
#    border_size = 1
#    border_color = $c_edge
#    position = $colx, -10
#    halign = center
#    valign = center
#    zindex = -2
#}

# ---------- Greeting, time, date ----------
# These float directly on the wallpaper, so they get a dark glow behind the letters.
label {
    monitor = $lockmon
    text = Welcome!
    color = $c_main
    font_size = 55
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.9)
    shadow_boost = 1.4
    position = $colx, 230
    halign = center
    valign = center
}

# 24-hour clock. Use $TIME12 instead of $TIME for 12-hour.
label {
    monitor = $lockmon
    text = $TIME
    color = $c_main
    font_size = 40
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.9)
    shadow_boost = 1.4
    position = $colx, 150
    halign = center
    valign = center
}

label {
    monitor = $lockmon
    text = cmd[update:60000] echo "$(date +'%A, %B %-d')"
    color = $c_main
    font_size = 20
    font_family = $font
    shadow_passes = 3
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.95)
    shadow_boost = 1.6
    position = $colx, 85
    halign = center
    valign = center
}

# ---------- User box and password field ----------
shape {
    monitor = $lockmon
    size = 320, 55
    color = $c_box
    rounding = -1
    border_size = 1
    border_color = $c_edge
    rotate = 0
    xray = false
    position = $colx, -10
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor = $lockmon
    text = $USER
    color = $c_main
    font_size = 16
    font_family = $font
    position = $colx, -10
    halign = center
    valign = center
    zindex = 2
}

input-field {
    monitor = $lockmon
    size = 320, 55
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $c_edge
    inner_color = $c_box
    font_color = $c_main
    fade_on_empty = false
    font_family = $font
    placeholder_text = <i><span foreground="##e6eaff">🔒 Enter Pass</span></i>
    hide_input = false
    position = $colx, -90
    halign = center
    valign = center
    zindex = 2
}
